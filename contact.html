<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Get in touch with Cafe & Workshop. We'd love to hear from you about our coffee, workshops, or any questions you may have.">
    <title>Contact Us - Cafe & Workshop</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="source/favicon.ico">
</head>
<body>
    <header>
        <nav>
            <div class="logo">
                <a href="index.html">Cafe & Workshop</a>
            </div>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="menu.html">Menu</a></li>
                <li><a href="index.html#workshops">Workshops</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
            <button class="hamburger" aria-label="Toggle menu" aria-expanded="false">
                <div class="line"></div>
                <div class="line"></div>
                <div class="line"></div>
            </button>
        </nav>
    </header>

    <main>
        <section class="contact-page">
            <h2>Contact Us</h2>
            <div class="contact-container">
                <div class="contact-info">
                    <h3>Our Address</h3>
                    <p>123 Coffee Lane, Creativity City, 12345</p>
                    <h3>Email</h3>
                    <p>hello@cafeandworkshop.com</p>
                    <h3>Phone</h3>
                    <p>(123) 456-7890</p>
                </div>
                <div class="contact-form">
                    <form id="contactForm" novalidate>
                        <div class="form-group">
                            <input type="text" name="name" id="name" placeholder="Your Name" required minlength="2" pattern="[A-Za-z\s]+" title="Please enter a valid name (letters and spaces only)">
                            <div class="error-message"></div>
                        </div>
                        <div class="form-group">
                            <input type="email" name="email" id="email" placeholder="Your Email" required>
                            <div class="error-message"></div>
                        </div>
                        <div class="form-group">
                            <textarea name="message" id="message" placeholder="Your Message" rows="5" required minlength="10"></textarea>
                            <div class="error-message"></div>
                        </div>
                        <button type="submit" class="cta-button">Send Message</button>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 Cafe & Workshop. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
